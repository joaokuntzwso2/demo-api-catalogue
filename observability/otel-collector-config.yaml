receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: wso2-mi
          scrape_interval: 30s
          static_configs:
            - targets: ["wso2-integrator:9164"]
        - job_name: health-status-cache
          scrape_interval: 30s
          metrics_path: /health
          static_configs:
            - targets: ["health-status-cache:6300"]

processors:
  batch: {}

exporters:
  logging:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [logging]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
