[server]
hostname = "wso2-integrator"

[keystore.primary]
file_name = "repository/resources/security/wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

[keystore.internal]
file_name = "repository/resources/security/wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
