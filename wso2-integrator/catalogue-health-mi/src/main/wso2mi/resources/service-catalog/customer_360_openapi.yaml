openapi: 3.0.1
info:
  title: Customer 360 Integration Service
  version: v1
  description: Composite Customer 360 API produced by WSO2 Integrator. It composes customer, account, card, and loan data from multiple backend APIs and is intended to be exposed as a managed API through WSO2 API Manager Service Catalog.
servers:
  - url: http://localhost:8290/customer-360/v1
paths:
  /customers/{customerId}:
    get:
      summary: Get a composed Customer 360 view
      operationId: getCustomer360
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: CUST-BR-001
      responses:
        '200':
          description: Composite customer profile
          content:
            application/json:
              schema:
                type: object
                required: [service, timestamp, customerId, sources]
                properties:
                  service:
                    type: string
                    example: customer-360-integration
                  timestamp:
                    type: string
                    format: date-time
                  customerId:
                    type: string
                  sources:
                    type: object
                    properties:
                      customer:
                        type: object
                      accounts:
                        type: object
                      cards:
                        type: object
                      loans:
                        type: object
  /health:
    get:
      summary: Health endpoint for the integration service
      operationId: getCustomer360Health
      responses:
        '200':
          description: Integration service is deployed
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    example: UP
                  service:
                    type: string
                    example: customer-360-integration
                  timestamp:
                    type: string
                    format: date-time
