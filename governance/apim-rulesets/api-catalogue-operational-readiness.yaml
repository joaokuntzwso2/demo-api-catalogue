rules:
  api-category-required:
    description: APIs must be assigned to at least one APIM category.
    message: API must have at least one APIM category before it can be deployed or published.
    severity: error
    given: $.data
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - categories
          properties:
            categories:
              type: array
              minItems: 1

  health-enabled-required:
    description: APIs must declare whether health checks are enabled.
    message: Missing required custom property health_enabled.
    severity: error
    given: $.data
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: [additionalPropertiesMap]
              properties:
                additionalPropertiesMap:
                  type: object
                  required: [health_enabled]
            - required: [additionalProperties]
              properties:
                additionalProperties:
                  type: array
                  contains:
                    type: object
                    required: [name]
                    properties:
                      name:
                        const: health_enabled

  health-backend-url-required:
