openapi: 3.0.1
info:
  title: Health Registry Proxy API
  version: v1
  description: Internal API exposed by WSO2 Integrator to retrieve APIM-sourced health registry metadata.
servers:
  - url: /
paths:
  /apis:
    get:
      summary: List registered API health strategies
      operationId: listHealthRegistryApis
      responses:
        "200":
          description: List of registered API health strategies.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /probes/run:
    post:
      summary: Manual full probe execution endpoint
      description: This endpoint intentionally returns HTTP 409 in the demo because browser/manual-triggered full probes are disabled.
      operationId: runManualProbes
      responses:
        "409":
          description: Manual full probe execution is disabled.
