openapi: 3.0.1
info:
  title: Catalogue Status API
  version: v1
  description: Internal API exposed by WSO2 Integrator to retrieve cached catalogue health status.
servers:
  - url: /
paths:
  /apis:
    get:
      summary: List catalogue API statuses
      operationId: listCatalogueStatuses
      responses:
        "200":
          description: List of cached API health statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /summary:
    get:
      summary: Get catalogue health summary
      operationId: getCatalogueStatusSummary
      responses:
        "200":
          description: Catalogue health summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
