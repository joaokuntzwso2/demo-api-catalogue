{
  "openapi": "3.0.3",
  "info": {
    "title": "Payments API",
    "version": "1.0.0",
    "description": "Inicia\u00e7\u00e3o e consulta de pagamentos internos e instant\u00e2neos."
  },
  "servers": [
    {
      "url": "http://localhost:5102"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Health endpoint",
        "responses": {
          "200": {
            "description": "Health response"
          },
          "503": {
            "description": "Service unavailable"
          }
        }
      }
    },
    "/payments/{paymentId}": {
      "get": {
        "summary": "Consultar pagamento",
        "parameters": [
          {
            "name": "paymentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/payments": {
      "post": {
        "summary": "Criar solicita\u00e7\u00e3o de pagamento",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created"
          },
          "400": {
            "description": "Invalid request"
          }
        }
      }
    }
  }
}