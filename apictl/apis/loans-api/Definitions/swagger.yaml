{
  "openapi": "3.0.3",
  "info": {
    "title": "Loans API",
    "version": "1.0.0",
    "description": "Consulta de propostas, contratos e simula\u00e7\u00f5es de cr\u00e9dito."
  },
  "servers": [
    {
      "url": "http://localhost:5105"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Health endpoint",
        "responses": {
          "200": {
            "description": "Health response"
          },
          "503": {
            "description": "Service unavailable"
          }
        }
      }
    },
    "/loans/{customerId}": {
      "get": {
        "summary": "Consultar empr\u00e9stimos do cliente",
        "parameters": [
          {
            "name": "customerId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/loans//simulations": {
      "post": {
        "summary": "Simular proposta de cr\u00e9dito",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created"
          },
          "400": {
            "description": "Invalid request"
          }
        }
      }
    }
  }
}