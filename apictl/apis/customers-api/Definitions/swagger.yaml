{
  "openapi": "3.0.3",
  "info": {
    "title": "Customers API",
    "version": "1.0.0",
    "description": "Consulta de dados cadastrais e perfil de cliente."
  },
  "servers": [
    {
      "url": "http://localhost:5103"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Health endpoint",
        "responses": {
          "200": {
            "description": "Health response"
          },
          "503": {
            "description": "Service unavailable"
          }
        }
      }
    },
    "/customers/{customerId}": {
      "get": {
        "summary": "Consultar cliente",
        "parameters": [
          {
            "name": "customerId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/customers/{customerId}/profile": {
      "get": {
        "summary": "Consultar perfil do cliente",
        "parameters": [
          {
            "name": "customerId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    }
  }
}